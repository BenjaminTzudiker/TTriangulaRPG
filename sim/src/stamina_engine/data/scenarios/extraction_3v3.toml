# Objectives O1, Escape that has to break contact: the party starts engaged with the NPC
# melee, 24 squares from the exits, and must get 2 of 3 off the map by the end of round 6
# through a one-square gap in a low wall (Review Addendum 2, retreat economics).
# The sides are mirrored (sample fighter, duelist, archer each) so the straight fight is close
# to even; the party is tactical chip-kill, the NPCs use the disciplined_2step profile.
# Set up by the checklist in sim/docs/USAGE_FOR_CHATS.md.
[scenario]
name = "extraction-3v3"
ruleset = "v0.9.2"
map = "extraction"
round_cap = 20
trials = 300
seed = 20261108

[[combatant]]
id = "fighter"
team = "party"
build = "l1_sample"
spawn = "P"
agent = { kind = "tactical", commit = "chipkill", objective = "first" }

[[combatant]]
id = "duelist"
team = "party"
build = "l1_duelist"
spawn = "P"
agent = { kind = "tactical", commit = "chipkill", objective = "first" }

[[combatant]]
id = "archer"
team = "party"
build = "l1_archer"
spawn = "P"
agent = { kind = "tactical", commit = "chipkill", objective = "first" }

[[combatant]]
id = "npc_fighter"
team = "npcs"
build = "l1_sample"
spawn = "N"
agent = { kind = "npc", profile = "disciplined_2step", objective = "first" }

[[combatant]]
id = "npc_duelist"
team = "npcs"
build = "l1_duelist"
spawn = "N"
agent = { kind = "npc", profile = "disciplined_2step", objective = "first" }

[[combatant]]
id = "npc_archer"
