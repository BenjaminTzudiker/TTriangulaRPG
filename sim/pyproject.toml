[project]
name = "stamina-engine"
version = "0.0.1"
description = "Rules engine for testing the stamina TTRPG's v0.9 design fixes"
requires-python = ">=3.12"
# The engine and its CLI need only the standard library, so a checkout runs without
# installing anything (PYTHONPATH=src python3 -m stamina_engine ...). pyarrow is for --out.
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=16"]

[project.scripts]
se = "stamina_engine.cli:main"

[dependency-groups]
dev = [
    "pyarrow>=16",
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stamina_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib -m 'not slow'"
markers = ["slow: full-count parity runs and long oracle differentials (pytest -m slow)"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
exclude = ["tests/oracle/"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/oracle"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
