[project]
name = "stamina-engine"
version = "0.0.1"
description = "Rules engine for testing the stamina TTRPG's v0.9 design fixes"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=16",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
se = "stamina_engine.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stamina_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
exclude = ["tests/oracle/"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/oracle"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
