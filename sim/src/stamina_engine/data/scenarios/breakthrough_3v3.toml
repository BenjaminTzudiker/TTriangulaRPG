# Objectives O1, Reach: the party must get 2 of 3 into the back row (Z) by the end of round 8.
# The only ways through the wall are two one-square gaps, each with an NPC standing in it;
# the zone is beyond one turn's movement (Review F9 at a line).
# The sides are mirrored (sample fighter, duelist, archer each) so the straight fight is close
# to even; the party is tactical chip-kill, the NPCs use the disciplined_2step profile.
# Set up by the checklist in sim/docs/USAGE_FOR_CHATS.md.
[scenario]
name = "breakthrough-3v3"
ruleset = "v0.9.3"
map = "breakthrough"
round_cap = 20
trials = 300
seed = 20261108

[[combatant]]
